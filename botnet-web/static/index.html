<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Network Detector (TikTok)</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/driver.js/dist/driver.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/driver.js/dist/driver.min.css" />
</head>
<body>
  <div class="container">
    <h1>Deteksi Jaringan Bot (TikTok)</h1>
    <p class="subtitle">Tempelkan URL video TikTok, atur batas komentar (opsional), lalu klik Analisis.</p>

    <form id="run-form">
      <input id="url" type="url" placeholder="https://www.tiktok.com/@user/video/123..." aria-label="URL Video TikTok" required />
      <input id="max_comments" type="number" min="10" max="10000" value="200" aria-label="Batas komentar" title="Batas komentar yang diambil" style="max-width:140px" />
      <button type="submit">Analisis</button>
    </form>
    <p class="helper">Contoh: https://www.tiktok.com/@akun/video/1234567890 • Batas komentar default 200</p>

    <div id="results">
      <div id="metrics"></div>
      <div id="graph" class="panel"></div>
      <div id="table" class="panel"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
