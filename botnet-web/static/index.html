<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Network Detector (TikTok)</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/driver.js/dist/driver.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/driver.js/dist/driver.min.css" />
</head>
<body>
  <div class="container">
    <h1>Deteksi Jaringan Bot (TikTok)</h1>

    <form id="run-form">
      <label>URL Video TikTok</label>
      <input id="url" type="url" placeholder="https://www.tiktok.com/@user/video/123..." required />

      <div class="row">
        <label>Max Komentar</label>
        <input id="max_comments" type="number" min="10" max="10000" value="200" />
      </div>

      <div class="row">
        <label>α mention</label>
        <input id="alpha" type="number" step="0.1" min="0" value="1.0" />
        <label>β reply</label>
        <input id="beta" type="number" step="0.1" min="0" value="0.8" />
        <label>γ content</label>
        <input id="gamma" type="number" step="0.1" min="0" value="0.5" />
        <label>δ thread</label>
        <input id="delta" type="number" step="0.1" min="0" value="0.5" />
      </div>

      <div class="row">
        <label>k-NN</label>
        <input id="k" type="number" min="1" max="200" value="15" />
        <label>T1</label>
        <input id="t1" type="number" step="0.05" min="0" max="1" value="0.8" />
        <label>T2</label>
        <input id="t2" type="number" step="0.05" min="0" max="1" value="0.6" />
      </div>

      <div class="row">
        <label><input id="mst" type="checkbox" checked /> Tampilkan MST overlay</label>
      </div>

      <button type="submit">Jalankan</button>
      <button type="button" id="tour">Tour</button>
    </form>

    <div id="results">
      <div id="metrics"></div>
      <div id="graph" class="panel"></div>
      <div id="table" class="panel"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
